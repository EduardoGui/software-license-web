@if (mostrarShell()) {
  <div class="shell">
    <aside class="sidebar">
      <div class="marca">
        <span class="marca__titulo">Adm Hope</span>
      </div>
      <nav class="menu">
        <a
          routerLink="/"
          routerLinkActive="menu__item--ativo"
          [routerLinkActiveOptions]="{ exact: true }"
          class="menu__item"
        >
          Dashboard
        </a>
        <a routerLink="/usuarios" routerLinkActive="menu__item--ativo" class="menu__item">Usuários</a>
        <button type="button" class="menu__grupo" (click)="alternarGrupoLicencas()">
          <span class="menu__grupo-seta">{{ grupoLicencasAberto() ? '▾' : '▸' }}</span>
          Licenças
        </button>
        @if (grupoLicencasAberto()) {
          <a routerLink="/licencas" routerLinkActive="menu__item--ativo" class="menu__item menu__item--sub">Licenças</a>
          <a routerLink="/movimentacoes" routerLinkActive="menu__item--ativo" class="menu__item menu__item--sub">Movimentações</a>
          <a routerLink="/timeline" routerLinkActive="menu__item--ativo" class="menu__item menu__item--sub">Linha do Tempo</a>
        }
      </nav>
      <div class="rodape">
        <span class="usuario-logado">{{ authService.obterEmail() }}</span>
        <button type="button" class="botao-sair" (click)="sair()">
          <app-icon name="log-out" [size]="16" /> Sair
        </button>
      </div>
    </aside>
    <main class="conteudo">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <router-outlet></router-outlet>
}
