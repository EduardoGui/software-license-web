<section class="form-page">
  <header class="topo">
    <h1>Nova nota fiscal de entrada</h1>
    <button type="button" class="botao-voltar" (click)="voltar()"><app-icon name="arrow-left" [size]="16" /> Voltar</button>
  </header>

  <form [formGroup]="form" (ngSubmit)="salvar()">
    @if (erro()) {
      <p class="status status--erro">{{ erro() }}</p>
    }

    <label>
      Número *
      <input type="text" formControlName="numero" />
      @if (form.controls.numero.invalid && form.controls.numero.touched) {
        <span class="campo-erro">Número é obrigatório.</span>
      }
    </label>

    <label>
      Data de entrada *
      <input type="date" formControlName="dataEntrada" />
      @if (form.controls.dataEntrada.invalid && form.controls.dataEntrada.touched) {
        <span class="campo-erro">Data de entrada é obrigatória.</span>
      }
    </label>

    <label>
      Fornecedor
      <div class="campo-com-acao">
        <select formControlName="fornecedorId">
          <option [ngValue]="null">Selecione</option>
          @for (fornecedor of fornecedores(); track fornecedor.id) {
            <option [ngValue]="fornecedor.id">{{ fornecedor.nome }}</option>
          }
        </select>
        @if (form.controls.fornecedorId.value) {
          <a
            [routerLink]="['/dp/fornecedores', form.controls.fornecedorId.value, 'editar']"
            (click)="prepararNavegacaoParaFornecedor()"
            class="botao-icone"
            title="Abrir cadastro do fornecedor"
          >
            <app-icon name="pencil" [size]="16" />
          </a>
        }
        <a
          routerLink="/dp/fornecedores/novo"
          (click)="prepararNavegacaoParaFornecedor()"
          class="botao-icone"
          title="Cadastrar novo fornecedor"
        >
          <app-icon name="plus" [size]="16" />
        </a>
      </div>
      @if (fornecedores().length === 0) {
        <span class="campo-aviso">Nenhum fornecedor cadastrado ainda — use o botão acima para criar um.</span>
      }
    </label>

    <label>
      Observação
      <textarea formControlName="observacao" rows="3"></textarea>
    </label>

    <div class="acoes">
      <button type="submit" class="botao botao--primario" [disabled]="salvando()">
        <app-icon name="check" [size]="16" /> {{ salvando() ? 'Salvando...' : 'Salvar' }}
      </button>
      <a routerLink="/equipamentos/notas-fiscais" class="botao botao--texto"><app-icon name="x" [size]="16" /> Cancelar</a>
    </div>
  </form>
</section>
