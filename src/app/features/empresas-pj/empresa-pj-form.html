<section class="form-page">
  <header class="topo">
    <h1>{{ editando ? 'Editar empresa PJ' : 'Nova empresa PJ' }}</h1>
    <button type="button" class="botao-voltar" (click)="voltar()"><app-icon name="arrow-left" [size]="16" /> Voltar</button>
  </header>

  @if (carregando()) {
    <p class="status">Carregando...</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="salvar()">
      @if (erro()) {
        <p class="status status--erro">{{ erro() }}</p>
      }

      <label>
        Razão social *
        <input type="text" formControlName="razaoSocial" />
        @if (form.controls.razaoSocial.invalid && form.controls.razaoSocial.touched) {
          <span class="campo-erro">Razão social é obrigatória.</span>
        }
      </label>

      <label>
        CNPJ *
        <input type="text" formControlName="cnpj" placeholder="00.000.000/0000-00" />
        @if (form.controls.cnpj.invalid && form.controls.cnpj.touched) {
          <span class="campo-erro">CNPJ é obrigatório.</span>
        }
      </label>

      <label>
        Status
        <select formControlName="ativa">
          <option [ngValue]="true">Ativa</option>
          <option [ngValue]="false">Inativa</option>
        </select>
      </label>

      <div class="acoes">
        <button type="submit" class="botao botao--primario" [disabled]="salvando()">
          <app-icon name="check" [size]="16" /> {{ salvando() ? 'Salvando...' : 'Salvar' }}
        </button>
        <a routerLink="/dp/empresas-pj" class="botao botao--texto"><app-icon name="x" [size]="16" /> Cancelar</a>
      </div>
    </form>
  }
</section>
